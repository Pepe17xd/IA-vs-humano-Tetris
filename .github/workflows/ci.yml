name: Validate Arena

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test browser engine and agent
        run: npm test
      - name: Lint and check JavaScript syntax
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Install Python research requirements
        run: python -m pip install -r requirements.txt
      - name: Test Python research tools
        run: python -m pytest -q -p no:cacheprovider
