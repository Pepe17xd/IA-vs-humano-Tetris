[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tetris-ai-research"
version = "0.1.0"
requires-python = ">=3.10"
description = "Offline Tetris AI research and read-only TETR.IO visual analysis"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
